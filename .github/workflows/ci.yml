name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: chat_system
          MYSQL_USER: chat_user
          MYSQL_PASSWORD: chat_password
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: sockets

      - name: Install Composer dependencies
        working-directory: ./laravel-app
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy .env and configure for CI
        working-directory: ./laravel-app
        run: |
          cp .env.example .env
          sed -i 's/DB_HOST=mysql-service/DB_HOST=127.0.0.1/' .env

      - name: Generate app key
        working-directory: ./laravel-app
        run: php artisan key:generate

      - name: Run migrations
        working-directory: ./laravel-app
        run: php artisan migrate --force

      - name: Run Laravel tests
        working-directory: ./laravel-app
        run: php artisan test

  vuejs-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: vuejs-app/package-lock.json

      - name: Install dependencies
        working-directory: ./vuejs-app
        run: npm install

      - name: Build frontend
        working-directory: ./vuejs-app
        run: npm run build
